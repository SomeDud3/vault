<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Vault</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#5b5bf0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#f5f6fa;--panel:#fff;--panel2:#eceef4;--text:#151924;--muted:#5b6475;--line:#e4e7ee;
  --accent:#4f4fe0;--accent-soft:#ececfe;--ok:#0c7a3d;--ok-soft:#e3f6ea;--warn:#8f5500;--warn-soft:#fdf3dc;
  --code:#0f1320;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0d12;--panel:#151922;--panel2:#1f2430;--text:#e8eaf0;--muted:#9aa3b5;--line:#1b202b;
  --accent:#8b8bff;--accent-soft:#23244a;--ok:#3ccf7e;--ok-soft:#14301f;--warn:#f0b43c;--warn-soft:#33270d;
  --code:#0a0c12;--shadow:none}}
:root[data-theme=dark]{
  --bg:#0b0d12;--panel:#151922;--panel2:#1f2430;--text:#e8eaf0;--muted:#9aa3b5;--line:#1b202b;
  --accent:#8b8bff;--accent-soft:#23244a;--ok:#3ccf7e;--ok-soft:#14301f;--warn:#f0b43c;--warn-soft:#33270d;
  --code:#0a0c12;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
/* lock */
#lock{min-height:100%;display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:0;border-radius:16px;box-shadow:var(--shadow)}
#lock .card{width:100%;max-width:380px;padding:32px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#c06bff);display:grid;place-items:center;color:#fff;margin-bottom:18px}
#lock h1{margin:0 0 4px;font-size:22px}
#lock p{margin:0 0 20px;color:var(--muted)}
.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
#lock .btn{width:100%;margin-top:12px}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--muted);font-size:14px}
#err{color:#e5484d;font-size:14px;min-height:20px;margin-top:10px}
/* app */
#app{display:none;height:100%;grid-template-columns:340px minmax(0,1fr)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:14px}
.brand .logo{width:30px;height:30px;border-radius:9px;margin:0}
.brand .sp{flex:1}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{color:var(--text);background:var(--panel2)}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
#list{overflow:auto;flex:1;padding:8px}
.group{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:2px}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--accent-soft)}
.item .t{font-weight:500;display:flex;gap:8px;align-items:flex-start}
.item .t span{flex:1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:12.5px;color:var(--muted);margin-top:2px;padding-left:16px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--warn)}
.dot.ok{background:var(--ok)}.dot.sub{background:var(--muted)}
#runbar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
#runbar span{flex:1}#runbar a{color:inherit}#runbar .ok{color:var(--ok)}#runbar .bad{color:#e5484d}
#runbar .btn{padding:4px 10px;font-size:12.5px}
main{overflow:auto;min-width:0}
.wrap{max-width:900px;margin:0 auto;padding:32px 28px 64px}
.back{display:none;margin-bottom:14px}
.crumb{color:var(--muted);font-size:13.5px;font-weight:500}
h2.title{font-size:28px;line-height:1.25;margin:6px 0 14px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pill{font-size:13px;padding:5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-decoration:none}
.kindpill{cursor:pointer;font:inherit;font-size:13px}
.item .t span.ki{display:inline;flex:none;margin-right:6px}
.chipsep{display:inline-block;width:1px;height:18px;background:var(--line);margin:0 4px;vertical-align:middle}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
a.pill:hover{color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--accent)}
.tab .n{font-size:12px;background:var(--panel2);border-radius:99px;padding:1px 7px;margin-left:4px}
.md{overflow-wrap:anywhere}
.md h1,.md h2,.md h3{line-height:1.3;margin:1.4em 0 .5em}
.md h1{font-size:22px}.md h2{font-size:19px}.md h3{font-size:16px}
.md code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:var(--panel2);padding:.15em .4em;border-radius:5px}
.md pre code{background:none;padding:0}
pre{background:var(--code);color:#e6e8ee;border-radius:12px;padding:16px;overflow:auto;font:13px/1.6 'JetBrains Mono',monospace;margin:0}
.md table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.file{margin-bottom:16px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.fhead .nm{flex:1;font-family:'JetBrains Mono',monospace;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .sz{color:var(--muted);font-size:12.5px}
.fhead .btn{padding:6px 12px;font-size:13px}
.file pre{border-radius:0;max-height:560px}
.file iframe{width:100%;height:640px;border:0;display:block;background:#fff}
.file img{max-width:100%;display:block;margin:auto}
#modal{border:0;padding:0;background:none;max-width:440px;width:calc(100% - 32px);color:inherit}
#modal::backdrop{background:rgba(0,0,0,.5)}
#modal .card{width:100%;padding:24px}
#modal h2{margin:0 0 8px;font-size:1.17em}#modal p{color:var(--muted);margin:0 0 14px;font-size:14px}
#modal textarea{width:100%;height:110px;font:12px 'JetBrains Mono',monospace;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:10px;resize:none}
#modal .row{display:flex;gap:8px;margin-top:12px}#modal .row .btn{flex:1}
.gh-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.gh-row .field{flex:1;min-width:180px;padding:9px 12px}
.tree{max-height:280px;overflow:auto;padding:6px}
.tree button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:7px;cursor:pointer;font:13px 'JetBrains Mono',monospace}
.tree button:hover{background:var(--panel2)}.tree button.sel{background:var(--accent-soft);color:var(--accent)}
#editor{width:100%;min-height:380px;font:13px/1.55 'JetBrains Mono',monospace;background:var(--code);color:#e6e8ee;border:0;padding:14px;resize:vertical;tab-size:4;display:block}
.status{font-size:13.5px;margin-top:8px;min-height:20px}.status.ok{color:var(--ok)}.status.bad{color:#e5484d}
.hrow{margin:4px 0;align-items:flex-start}
.hrow code{word-break:break-all;white-space:normal}
.hmore{margin:6px 0}
.ckhead:empty{display:none}.ckhead{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
.ckbar{flex:none;width:90px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}.ckbar i{display:block;height:100%;background:var(--ok)}
.md.notes li.ck{list-style:none;margin-left:-1.2em}.md.notes li.ck input{accent-color:var(--accent);width:17px;height:17px;margin-right:8px;vertical-align:-3px;cursor:pointer}
.md.notes li.ck:has(input:checked){color:var(--muted);text-decoration:line-through}
.pv{padding:6px 18px 14px;overflow:auto;max-height:75vh}
.pv .sheet{overflow:auto}.pv .sheet table{border-collapse:collapse;font-size:13px}
.pv .sheet td{border:1px solid var(--line);padding:3px 8px;white-space:nowrap}
.pv .slide{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0}
.pv .ziplist div{display:flex;gap:10px;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line)}
.pv .ziplist code{word-break:break-all}.pv .nbout{opacity:.85;border-left:3px solid var(--line)}
.pv img{max-width:100%}.docx img{max-width:100%}
.dot.bad{background:#e5484d}
.grow{display:flex;gap:12px;align-items:flex-start;padding:10px 18px;border-top:1px solid var(--line)}
.grow[data-open]{cursor:pointer}
.grow details{margin-top:4px}
.gval{flex:none;font-variant-numeric:tabular-nums}
.hmore summary{cursor:pointer;margin:4px 0}
select.field{padding:9px 12px}
.fc{padding:28px 22px;text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.fc .q{font-size:20px;font-weight:600;line-height:1.35}.fc .a{font-size:17px;color:var(--ok)}
.fc .src{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--ok)}
.fc-btns{display:flex;gap:10px;margin-top:16px}.fc-btns .btn{flex:1;padding:14px}
.btn.bad{background:#e5484d}.btn.good{background:var(--ok)}
#print{display:none}
@media print{
  @page{margin:16mm 14mm}
  body{background:#fff!important;color:#111}
  #app,#lock,#modal,#tabbar{display:none!important}
  #print{display:block;font:11pt/1.5 Inter,system-ui,sans-serif;color:#111}
  #print h1{font-size:20pt;margin:0 0 4pt}#print h2{font-size:14pt;margin:18pt 0 6pt;border-bottom:1px solid #ccc;padding-bottom:3pt}
  #print .meta{color:#555;font-size:10pt;margin-bottom:12pt}
  #print pre{background:#f5f6f8!important;color:#111!important;border:1px solid #ddd;border-radius:6px;padding:8pt;font:8.5pt/1.45 'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word;max-height:none;overflow:visible}
  #print pre code,#print pre code *{color:inherit!important;background:none!important}
  #print .fname{font:600 9.5pt 'JetBrains Mono',monospace;margin:12pt 0 4pt}
  #print .md code{background:#f0f0f0;padding:0 3pt;border-radius:3px}
  #print table{border-collapse:collapse}#print th,#print td{border:1px solid #ccc;padding:3pt 6pt}
  #print .md h1,#print .md h2,#print .md h3{font-size:12pt;border:0;margin:12pt 0 4pt;padding:0}
  #print h2,#print .fname{break-after:avoid}#print pre{break-inside:auto}
}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.empty .big{font-size:40px;margin-bottom:8px}
/* nav */
.snav{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
.snav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);text-align:left}
.snav button:hover{background:var(--panel2);color:var(--text)}
.snav button.on{background:var(--accent-soft);color:var(--accent)}
.snav svg,#tabbar svg{width:20px;height:20px;flex:none}
#tabbar{display:none}
.group{display:flex;align-items:center;gap:8px}.gdot{width:8px;height:8px;border-radius:3px;background:var(--c)}
/* dashboard */
.home-head{margin-bottom:18px}
.hero{display:block;width:100%;text-align:left;cursor:pointer;padding:22px;margin-bottom:16px;border:0;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#2a1b6b))}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero .crumb{color:rgba(255,255,255,.8)}
.hchip{font-size:12px;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.22);color:#fff;padding:4px 10px;border-radius:99px}
.hero-title{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:16px;position:relative;z-index:1}
.countdown{display:flex;gap:10px;margin-bottom:16px;position:relative;z-index:1}
.countdown div{background:rgba(0,0,0,.18);border-radius:12px;padding:8px 0;min-width:62px;text-align:center}
.countdown b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.countdown span{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.countdown.late div{background:rgba(229,72,77,.5)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.95;position:relative;z-index:1;gap:8px;flex-wrap:wrap}
.hero-foot .pill{background:rgba(255,255,255,.2);color:#fff;border:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.tile{padding:14px 16px}.tile .tv{font-size:24px;font-weight:700;margin:4px 0 0}.tile .tl{font-size:12.5px;color:var(--muted)}
.sec-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 4px}
.week{padding:6px;margin-bottom:22px}
.wk{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.wk:hover{background:var(--panel2)}
.wk-day{width:58px;flex:none;border-left:3px solid var(--c);padding-left:10px}.wk-day b{display:block;font-size:14px}.wk-day span{font-size:12px;color:var(--muted)}
.wk-main{flex:1;min-width:0}.wk-t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;cursor:pointer;text-align:left;font-size:22px}
.qa b{font-size:15px;margin-top:6px}.qa span{font-size:12.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item:focus-visible,.seg button:focus-visible{outline-offset:-2px}
.skip{position:fixed;left:12px;top:-60px;z-index:30;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
#main:focus{outline:none}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px}.banner span{flex:1;font-size:14px}
.set{padding:6px;margin-bottom:16px}
.set button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:13px 12px;cursor:pointer;text-align:left;font-size:15px}
.set button:hover{background:var(--panel2)}.set button span{flex:1}.set button small{color:var(--muted);font-size:12.5px}
.swipe-hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
/* lock screen */
#lock{background:radial-gradient(60% 50% at 20% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(50% 40% at 90% 90%,color-mix(in srgb,#c06bff 18%,transparent),transparent),var(--bg)}
/* motion */
@media (prefers-reduced-motion:no-preference){
  .wrap>*{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
  .wrap>*:nth-child(2){animation-delay:.03s}.wrap>*:nth-child(3){animation-delay:.06s}.wrap>*:nth-child(4){animation-delay:.09s}
  .wrap>*:nth-child(5){animation-delay:.12s}.wrap>*:nth-child(6){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  #lock .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .btn,.item,.qa,.wk,.hero,.tab,.set button,#tabbar button{transition:transform .12s ease,background .15s ease,color .15s ease}
  .btn:active,.item:active,.qa:active,.wk:active,.hero:active,.set button:active,#tabbar button:active{transform:scale(.96)}
  .fc{transition:transform .2s ease,background .2s ease}
}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  #app[data-view=list] main{display:none}
  #app:not([data-view=list]) aside{display:none}
  aside{border-right:0}
  .snav,.brand .icon-btn{display:none}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;border-radius:12px;padding:7px 0 5px;font-size:11px;font-weight:600;color:var(--muted)}
  #tabbar button.on{color:var(--accent)}
  #tabbar button.on svg{transform:translateY(-1px)}
  main,#list{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .side-head{padding-top:calc(18px + env(safe-area-inset-top))}
  .wrap{padding:calc(20px + env(safe-area-inset-top)) 16px 48px}
  .back{display:inline-flex}
  h2.title{font-size:23px}
  .tiles{grid-template-columns:1fr 1fr}
  .countdown div{min-width:0;flex:1}
}
/* ===== redesign (mockup 2026-11-16) ===== */
:root{--r:16px;--soon:#8f5500;--soon-bg:#fcefd2;--late:#c4302b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--soon:#f5b041;--soon-bg:#2b2212;--late:#ff6b6b}}

/* page transitions */
main{view-transition-name:pane}aside{view-transition-name:side}#tabbar{view-transition-name:tabbar}
.vt .wrap>*{animation:none}
::view-transition-group(*){animation-duration:.28s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(pane),::view-transition-new(pane),::view-transition-old(side),::view-transition-new(side){animation-duration:.28s;animation-timing-function:cubic-bezier(.2,.8,.2,1);animation-fill-mode:both}
html[data-nav=fwd]::view-transition-old(pane){animation-name:vt-out-l}
html[data-nav=fwd]::view-transition-new(pane){animation-name:vt-in-r}
html[data-nav=back]::view-transition-old(pane){animation-name:vt-out-r}
html[data-nav=back]::view-transition-new(pane){animation-name:vt-in-l}
html[data-nav=swap]::view-transition-old(pane){animation-name:vt-fade-out;animation-duration:.14s}
html[data-nav=swap]::view-transition-new(pane){animation-name:vt-rise}
html[data-nav=tab]::view-transition-old(pane){animation-name:vt-fade-out;animation-duration:.1s}
html[data-nav=tab]::view-transition-new(pane){animation-name:vt-fade-in;animation-duration:.16s}
/* phone: list (aside) and detail (main) replace each other */
html[data-nav=fwd]::view-transition-old(side){animation-name:vt-out-l}
html[data-nav=back]::view-transition-new(side){animation-name:vt-in-l}
html[data-nav=back]::view-transition-old(side),html[data-nav=fwd]::view-transition-new(side){animation-name:vt-fade-in}
::view-transition-old(tabbar),::view-transition-new(tabbar){animation-duration:.18s}
@keyframes vt-in-r{from{transform:translateX(28px);opacity:0}}
@keyframes vt-in-l{from{transform:translateX(-28px);opacity:0}}
@keyframes vt-out-l{to{transform:translateX(-28px);opacity:0}}
@keyframes vt-out-r{to{transform:translateX(28px);opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-rise{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

.calbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.calbar .field{flex:1;max-width:360px}

<script>
const VAPID_PUBLIC = 'BPOXGIUb55PgagfBOBUGyndh1symZGpvwo_ElxnJ-IiFrj5gyFLYCJMs73JxHcEKDyOUXuhDaM6MxCw3roAcRYU';
const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = {get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
let KEY, GH = null, ITEMS = [], GRADES = [], filter = 'open', selId = null, tab = 'solution';

// theme
const applyTheme = t => t ? document.documentElement.dataset.theme = t : delete document.documentElement.dataset.theme;
applyTheme(store.get('theme'));
$('#theme').onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark'; store.set('theme', t); applyTheme(t);
};

async function decrypt(key, buf) {
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, key, buf.slice(12)));
}
async function load(key, meta) {
  const P = JSON.parse(new TextDecoder().decode(await decrypt(key, b64(meta.data))));
  ITEMS = Array.isArray(P) ? P : P.items; GH = Array.isArray(P) ? null : P.gh; GRADES = (!Array.isArray(P) && P.grades) || [];
  KEY = key;
  $('#lock').style.display = 'none'; $('#app').style.display = 'grid';
  const h = decodeURIComponent(location.hash.slice(1));
  selId = ITEMS.some(i => i.id === h) ? h : null;
  renderList(); go(selId ? 'detail' : (['practice','list','more','grades','calendar'].includes(h) ? h : 'home'));
  if (GH) runStatus();
  // offline: keep every encrypted file in the cache so the vault works without internet
  if ('caches' in window && navigator.onLine) caches.open('vault-v1').then(c => c.addAll(
    [...new Set(ITEMS.flatMap(i => i.files.concat(i.solution)).filter(f => f.blob).map(f => f.blob).concat(ITEMS.map(i => i.tb).filter(Boolean)).map(u => new URL(u, location).href))])).catch(() => {});
}
async function boot() {
  const meta = await (await fetch('data.json', {cache:'no-store'})).json();
  window.META = meta;
  const saved = store.get('vaultkey:' + meta.salt);
  if (saved) {
    try { await load(await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']), meta); return; }
    catch { store.del('vaultkey:' + meta.salt); }
  }
}
$('#lockform').onsubmit = async e => {
  e.preventDefault(); $('#err').textContent = ''; $('#unlock').disabled = true; $('#unlock').textContent = 'Entschlüssle…';
  try {

    $('#ptgo').textContent = sha ? 'Wünsche aktualisieren' : 'Auf PC starten';
  };
  await refresh();
  clearInterval(ptTimer); ptTimer = setInterval(refresh, 20000);
  $('#ptgo').onclick = async () => {
    $('#ptgo').disabled = true; stat('Sende…');
    try {
      const body = {dir: i.dir, note: $('#ptnote').value.trim(), requested: new Date().toISOString()};
      await api(ptPath(i), {method: 'PUT', body: JSON.stringify({message: 'PC-Job angefordert: ' + i.title, content: utf8b64(JSON.stringify(body, null, 1)), ...(sha ? {sha} : {})})});
      stat('✓ In Warteschlange – dein PC holt es in ≤3 min ab.', true); await refresh();
    } catch (e) { stat(e.status === 409 || e.status === 422 ? 'Der Job hat sich gerade geändert (läuft schon?) – Status neu geladen.' : 'Fehler: ' + e.message, false); await refresh(); }
    $('#ptgo').disabled = false;
  };
  $('#ptcancel').onclick = async () => {
    try { await api(ptPath(i), {method: 'DELETE', body: JSON.stringify({message: 'PC-Job abgebrochen: ' + i.title, sha})}); stat('Abgebrochen.', true); wasActive = false; await refresh(); }
    catch (e) { await refresh(); stat(e.status === 404 || e.status === 409 ? 'Nicht mehr abbrechbar – der Job läuft schon oder ist fertig.' : 'Fehler: ' + e.message, false); }
  };
}
// Üben: Karteikarten aus den "Mögliche Testfragen" der Lernzettel ("- Frage? -> Antwort")
const cardsOf = i => {
  if (!i.lern) return [];
  const sec = i.lern.split(/^#+[^\n]*Testfragen[^\n]*$/m)[1]; if (!sec) return [];
  return sec.split(/^#/m)[0].split('\n').map(l => l.replace(/^\s*(?:[-*]|\d+[.)])\s*/, '')).filter(l => l.includes('->'))
    .map(l => { const k = l.indexOf('->'); return {q: l.slice(0, k).trim(), a: l.slice(k + 2).trim(), id: i.id + ':' + l.slice(0, k).trim(), src: i.title}; });
};
const known = { get: () => { try { return JSON.parse(localStorage.getItem('known') || '{}') } catch { return {} } },
                set: o => { try { localStorage.setItem('known', JSON.stringify(o)) } catch {} } };
const inl = s => DOMPurify.sanitize(marked.parseInline(s));
function practice(items) {
  const all = items.flatMap(cardsOf);
  selId = null; renderList(); setView('practice'); $('main').scrollTop = 0;
  if (!all.length) { $('#detail').innerHTML = '<button class="btn ghost back" id="back">← Zurück</button><div class="empty"><div class="big">🧠</div>Noch keine Testfragen.</div>'; return; }
  let k = known.get(), deck = [], idx = 0, shown = false;
  const build = () => { k = known.get(); const unk = all.filter(c => !k[c.id]); deck = (unk.length ? unk : all).sort(() => Math.random() - .5); idx = 0; shown = false; };
  const draw = () => {
    const done = all.filter(c => k[c.id]).length, c = deck[idx];
    $('#detail').innerHTML = `<button class="btn ghost back" id="back">← Zurück</button>
      <div class="crumb">${items.length === 1 ? esc(items[0].title) : 'Alle offenen Abgaben'}</div><h2 class="title">🧠 Üben</h2>
      <div class="crumb">${done}/${all.length} gewusst</div><div class="bar"><i style="width:${100*done/all.length}%"></i></div>
      ${c ? `<div class="card fc" id="fc"><div class="src">${esc(c.src)} · Karte ${idx+1}/${deck.length}</div><div class="q">${inl(c.q)}</div>
        ${shown ? `<div class="a">${inl(c.a)}</div>` : '<div class="crumb">Tippen zum Aufdecken</div>'}</div>
        ${shown ? '<div class="fc-btns"><button class="btn bad" id="no">✗ Nochmal</button><button class="btn good" id="yes">✓ Gewusst</button></div><div class="swipe-hint">← wischen: Nochmal · Gewusst: wischen →</div>' : ''}`
      : `<div class="card fc"><div class="q">🎉 Durch!</div><div class="crumb">${done === all.length ? 'Alles gewusst.' : 'Runde fertig – die falschen kommen nochmal.'}</div>
         <div class="fc-btns"><button class="btn" id="again">Nochmal üben</button><button class="btn ghost" id="reset">Fortschritt zurücksetzen</button></div></div>`}`;
    if ($('#fc')) $('#fc').onclick = () => { if (!shown) { shown = true; draw(); } };
    const answer = ok => { if (ok) k[c.id] = 1; else { delete k[c.id]; deck.push(c); } known.set(k); idx++; shown = false; draw(); };
    if ($('#yes')) { $('#yes').onclick = () => answer(true); $('#no').onclick = () => answer(false); swipe($('#fc'), dir => answer(dir > 0)); }
    if ($('#again')) { $('#again').onclick = () => { build(); draw(); };
      $('#reset').onclick = () => { const o = known.get(); all.forEach(c => delete o[c.id]); known.set(o); build(); draw(); }; }
  };
  build(); draw();
}
$('#practice').onclick = () => go('practice');
// ---------- app shell: views, dashboard, gestures, install ----------
let view = 'home', installEvt = null;
const COURSE_C = ['#60A5FA', '#2DD4BF', '#FB923C', '#F472B6', '#A78BFA', '#FACC15', '#4ADE80', '#F87171', '#38BDF8', '#C084FC'];
const hueOf = c => { let h = 0; for (const ch of (c || '').split('_')[0]) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COURSE_C[h % COURSE_C.length]; };
const shortC = i => i.courseShort.split('_')[0];
function setView(v) {
  view = v; $('#app').dataset.view = v;
  document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === (v === 'detail' ? 'list' : v)));
}
// Page transitions (View Transitions API): deeper = slide in from the right, back = from the left,
// same level = crossfade. No API or "reduce motion" -> instant, exactly as before.
const VT_OK = typeof document.startViewTransition === 'function';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const DEPTH = {home: 0, list: 1, practice: 1, grades: 1, more: 1, calendar: 1, detail: 2};
if (VT_OK) document.documentElement.classList.add('vt');
function transition(kind, update) {
  if (!VT_OK || reduceMotion.matches || !ITEMS.length) return update();
  document.documentElement.dataset.nav = kind;
  const t = document.startViewTransition(update);
  t.ready.catch(() => {}); t.updateCallbackDone.catch(e => console.error(e));  // a newer navigation skips this one: fine
  t.finished.catch(() => {}).finally(() => { if (document.documentElement.dataset.nav === kind) delete document.documentElement.dataset.nav; });
}
function go(v) {
  const from = view, d = (DEPTH[v] ?? 1) - (DEPTH[from] ?? 1);
  if (from === v && v !== 'detail') return goNow(v);  // plain re-render: no animation
  transition(d > 0 ? 'fwd' : d < 0 ? 'back' : 'swap', () => goNow(v));
}
function goNow(v) {
  if (v === 'practice') return practice(ITEMS.filter(isOpen));
  if (v === 'calendar') { setView('calendar'); $('main').scrollTop = 0; return renderCalendar(); }
  if (v === 'grades') { setView('grades'); $('main').scrollTop = 0; return renderGrades(); }
  setView(v); $('main').scrollTop = 0;
  if (v === 'home') renderHome();
  else if (v === 'more') renderMore();
  else if (v === 'detail' || innerWidth > 820) { if (v === 'list' && !selId) renderHome(); else renderDetail(); }
  if (v === 'list' && innerWidth > 820) $('#q').focus();
}
const statusTxt = i => i.submitted ? '✓ Abgegeben' : i.done ? '✓ Lösung bereit' : 'In Arbeit';
function dayLabel(t) {
  const d = new Date(t), today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((new Date(d).setHours(0,0,0,0) - today) / 864e5);
  return diff === 0 ? 'Heute' : diff === 1 ? 'Morgen' : diff < 0 ? 'Vorbei' : d.toLocaleDateString('de-AT', {weekday: 'short'});
}
function renderHome() {
  const now = Date.now(), open = ITEMS.filter(isOpen);
  const dated = open.filter(i => dueTs(i) !== Infinity).sort((a, b) => dueTs(a) - dueTs(b));
  const next = dated.find(i => dueTs(i) > now) || dated[dated.length - 1];
  const week = dated.filter(i => dueTs(i) > now && dueTs(i) < now + 7 * 864e5);
  const k = known.get(), cards = open.flatMap(cardsOf), kn = cards.filter(c => k[c.id]).length;
  const hr = new Date().getHours(), greet = hr < 11 ? 'Guten Morgen' : hr < 18 ? 'Hallo' : 'Guten Abend';
  const badge = i => { const t = dueTs(i) - now; return t < 0 ? ['late', 'Überfällig'] : t < 864e5 ? ['soon', dueShort(i)] : ['', dueShort(i)]; };
  const primary = i => i.route === 'pc' && !i.done ? 'Auf PC starten' : i.route === 'pc' && i.pt ? 'Auf PC starten' : i.done ? 'Lösung ansehen' : 'Öffnen';
  const time = t => new Date(t).toLocaleTimeString('de-AT', {hour: '2-digit', minute: '2-digit'});
  $('#detail').innerHTML = `
    <div class="home-top"><div><div class="crumb">${new Date().toLocaleDateString('de-AT', {weekday: 'long', day: 'numeric', month: 'long'})}</div>
      <h2 class="title">${greet}</h2></div>
      <div class="hbtns"><button class="sq" data-act="search" aria-label="Suchen">${ic('search', 20)}</button><button class="sq" data-go="more" aria-label="Einstellungen">${ic('gear', 20)}</button></div></div>
    ${installEvt && !matchMedia('(display-mode: standalone)').matches ? `<div class="card banner"><span>${ic('install')} Vault als App installieren – mit eigenem Icon.</span><button class="btn" data-act="install">Installieren</button></div>` : ''}
    ${next ? (([bc, bl]) => `<div class="card hero2" style="--c:${hueOf(next.courseShort)}">
        <div class="h2top"><span class="h2lbl"><i class="cdot"></i>${esc(shortC(next))} · Nächste Abgabe</span>${bl ? `<span class="badge ${bc}">${esc(bl)}</span>` : ''}</div>
        <h3>${esc(next.title)}</h3>
        <div class="crumb">Fällig ${time(dueTs(next))} · noch <b class="cd" data-due="${dueTs(next)}"></b></div>
        <div class="h2route">${routeOf(next)[0]} ${routeOf(next)[1]} · ${statusTxt(next)}</div>
        <div class="h2btns"><button class="btn" data-open="${next.id}">${primary(next)}</button></div></div>`)(badge(next))
      : `<div class="card hero2"><h3>Nichts offen</h3><div class="crumb">Alles abgegeben oder ohne Frist.</div></div>`}
    <div class="card strip"><div><b>${open.length}</b><span>offen</span></div><div><b class="okc">${open.filter(i => i.done).length}</b><span>Lösung bereit</span></div><div><b>${ITEMS.filter(i => i.submitted).length}</b><span>abgegeben</span></div></div>
    <div class="sec-row"><h3>Diese Woche</h3><button class="lnk" data-go="list">Alle Abgaben</button></div>
    <div class="wklist">${week.length ? week.map(i => `<button class="wkr" data-open="${i.id}">
        <span class="wkd"><b>${esc(dayLabel(dueTs(i)))}</b><span>${time(dueTs(i))}</span></span>
        <span class="wkm"><span class="wkt">${esc(i.title)}</span><span class="crumb"><i class="cdot" style="--c:${hueOf(i.courseShort)}"></i>${esc(shortC(i))} · ${statusTxt(i)}</span></span>${ic('chev')}</button>`).join('')
      : '<div class="crumb" style="padding:14px 4px">Diese Woche nichts mehr fällig.</div>'}</div>
    <div class="quick">
      <button class="card qa" data-go="practice">${ic('cards', 20)}<b>Üben</b><span>${cards.length - kn} von ${cards.length} Karten offen</span></button>
      ${GRADES.length ? (g => `<button class="card qa" data-act="grades">${ic('grad', 20)}<b>Noten</b><span>${g ? esc(g.name) + ': ' + esc(g.grade || '–') : ''}</span></button>`)(latestGrade()) : ''}
      <button class="card qa" data-act="run">${ic('refresh', 20)}<b>Jetzt prüfen</b><span data-runmirror>${GH ? $('#runtxt').innerHTML : 'offline'}</span></button>
    </div>`;
  tick();
}
function renderMore() {

  $('#detail').innerHTML = `<h2 class="title">Einstellungen</h2>
    <div class="card set">
      ${row('grades', 'grad', 'Noten & Feedback', GRADES.length ? `${GRADES.filter(g => g.type !== 'course').length} bewertet` : 'noch keine')}

      ${row('bell', 'bell', 'Push-Benachrichtigungen', typeof Notification !== 'undefined' && Notification.permission === 'granted' ? 'aktiv auf diesem Gerät' : 'auf diesem Gerät einrichten')}
      ${row('theme', 'theme', 'Hell / Dunkel umschalten')}
      ${standalone ? '' : row('install', 'install', 'Als App installieren', installEvt ? 'eigenes Icon am Startbildschirm' : 'Browser-Menü → „Zum Startbildschirm hinzufügen“')}
    </div>
    <div class="card set">${row('lock', 'lock', 'Sperren', 'Passwort beim nächsten Öffnen nötig')}</div>
    <p class="crumb" style="text-align:center">Vault · ${ITEMS.length} Abgaben · ${ITEMS.flatMap(cardsOf).length} Karteikarten</p>`;
}
// live countdown
function tick() {
  document.querySelectorAll('[data-due]').forEach(el => {
    const s = Math.round((+el.dataset.due - Date.now()) / 1000);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    el.className = 'cd ' + (s < 0 ? 'late' : s < 86400 ? 'soon' : '');
    el.textContent = s < 0 ? 'überfällig' : (d ? `${d} T ` : '') + `${h} Std ${m} Min`;
  });
}
setInterval(tick, 1000);
// global clicks: nav, open item, actions
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { if (g.dataset.go !== 'list' || innerWidth <= 820) { selId = null; location.hash = ''; renderList(); } go(g.dataset.go); return; }
  const o = e.target.closest('[data-open]'); if (o) { selId = o.dataset.open; tab = 'solution'; location.hash = selId; renderList(); go('detail'); return; }
  if (e.target.closest('[data-reload]')) { e.preventDefault(); location.reload(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'run') $('#runnow').click();
  if (act === 'search') { selId = null; go('list'); setTimeout(() => $('#q').focus(), 50); }
  if (act === 'grades') { location.hash = 'grades'; go('grades'); }
  if (act === 'bell') $('#bell').click();
  if (act === 'theme') $('#theme').click();
  if (act === 'lock') $('#logout').click();
  if (act === 'install') { if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; go(view); }); }
    else modal('App installieren', 'Im Browser-Menü (⋮) „Zum Startbildschirm hinzufügen“ bzw. „App installieren“ wählen.'); }
});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (ITEMS.length && (view === 'home' || view === 'more')) go(view); });
// swipe: flashcards left/right, edge-swipe back from detail
function swipe(el, cb) {
  if (!el) return; let x0 = null, dx = 0;
  el.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; dx = 0; el.style.transition = 'none'; }, {passive: true});
  el.addEventListener('touchmove', e => { if (x0 === null) return; dx = e.touches[0].clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
    el.style.background = `color-mix(in srgb, ${dx > 0 ? 'var(--ok)' : '#e5484d'} ${Math.min(30, Math.abs(dx) / 4)}%, var(--panel))`; }, {passive: true});
  el.addEventListener('touchend', () => { el.style.transition = '';
    if (Math.abs(dx) > 90) { el.style.transform = `translateX(${dx > 0 ? 120 : -120}vw) rotate(${dx > 0 ? 20 : -20}deg)`; setTimeout(() => cb(dx), 180); }
    else { el.style.transform = ''; el.style.background = ''; } x0 = null; });
}
(() => { let x0 = null, y0 = 0;
  addEventListener('touchstart', e => { const t = e.touches[0]; x0 = view === 'detail' && t.clientX < 28 ? t.clientX : null; y0 = t.clientY; }, {passive: true});
  addEventListener('touchend', e => { if (x0 === null) return; const t = e.changedTouches[0];
    if (t.clientX - x0 > 80 && Math.abs(t.clientY - y0) < 60) { selId = null; location.hash = ''; renderList(); go('list'); } x0 = null; }, {passive: true});
})();
// PDF export: build a clean print document, then the browser's "Save as PDF"
function exportPdf(i, what) {
  const sec = (h, inner) => `<h2>${h}</h2>${inner}`;
  const files = i.solution.map(f => f.text != null && !/\.(md)$/i.test(f.name)
    ? `<div class="fname">${esc(f.name)}</div><pre><code>${esc(f.text)}</code></pre>`
    : f.text != null ? `<div class="fname">${esc(f.name)}</div><div class="md">${md(f.text)}</div>`
    : `<div class="fname">${esc(f.name)} <span style="font-weight:400;color:#777">(${kb(f.size)}, Datei – nicht druckbar)</span></div>`).join('');
  let body = '';
  if (what !== 'lern') body += (i.notes ? sec('Notizen', `<div class="md">${md(i.notes)}</div>`) : '') + (files ? sec('Dateien', files) : '');
  if (what !== 'solution' && i.lern) body += sec('Lernzettel', `<div class="md">${md(i.lern)}</div>`);
  if (what === 'all') body = sec('Angabe', `<div class="md">${md(i.angabe)}</div>`) + body;
  $('#print').innerHTML = `<h1>${esc(i.title)}${what === 'lern' ? ' – Lernzettel' : ''}</h1>
    <div class="meta">${esc(i.course)} · Abgabe ${esc(i.due)} · Shahab Sadaat, 4CHIF</div>${body}`;
  $('#print').querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  const old = document.title;
  document.title = `${i.title}${what === 'lern' ? ' - Lernzettel' : ''}`.replace(/[\\/:*?"<>|]/g, '');
  setTimeout(() => { window.print(); document.title = old; }, 50);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pdf]'); if (!b) return;
  const i = ITEMS.find(x => x.id === selId); if (i) exportPdf(i, b.dataset.pdf);
});
// links like …/vault/#<id> or #practice while the vault is already open
addEventListener('hashchange', () => {

boot();
