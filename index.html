<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Vault</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#5b5bf0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#f6f7fb;--panel:#fff;--panel2:#f0f2f8;--text:#161a25;--muted:#667085;--line:#e3e6ef;
  --accent:#5b5bf0;--accent-soft:#ececfe;--ok:#12a150;--ok-soft:#e3f6ea;--warn:#c27803;--warn-soft:#fdf3dc;
  --code:#0f1320;--shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0c0e14;--panel:#141721;--panel2:#1b1f2c;--text:#e7e9f0;--muted:#8b93a7;--line:#262b3a;
  --accent:#8b8bff;--accent-soft:#23244a;--ok:#3ccf7e;--ok-soft:#14301f;--warn:#f0b43c;--warn-soft:#33270d;
  --code:#0a0c12;--shadow:none}}
:root[data-theme=dark]{
  --bg:#0c0e14;--panel:#141721;--panel2:#1b1f2c;--text:#e7e9f0;--muted:#8b93a7;--line:#262b3a;
  --accent:#8b8bff;--accent-soft:#23244a;--ok:#3ccf7e;--ok-soft:#14301f;--warn:#f0b43c;--warn-soft:#33270d;
  --code:#0a0c12;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
/* lock */
#lock{min-height:100%;display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
#lock .card{width:100%;max-width:380px;padding:32px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#c06bff);display:grid;place-items:center;color:#fff;margin-bottom:18px}
#lock h1{margin:0 0 4px;font-size:22px}
#lock p{margin:0 0 20px;color:var(--muted)}
.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
#lock .btn{width:100%;margin-top:12px}
.check{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--muted);font-size:14px}
#err{color:#e5484d;font-size:14px;min-height:20px;margin-top:10px}
/* app */
#app{display:none;height:100%;grid-template-columns:340px 1fr}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:14px}
.brand .logo{width:30px;height:30px;border-radius:9px;margin:0}
.brand .sp{flex:1}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{color:var(--text);background:var(--panel2)}
.stats{display:flex;gap:8px;margin:12px 0 0}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
#list{overflow:auto;flex:1;padding:8px}
.group{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:2px}
.item:hover{background:var(--panel2)}
.item.sel{background:var(--accent-soft)}
.item .t{font-weight:500;display:flex;gap:8px;align-items:flex-start}
.item .t span{flex:1;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m{font-size:12.5px;color:var(--muted);margin-top:2px;padding-left:16px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--warn)}
.dot.ok{background:var(--ok)}.dot.sub{background:var(--muted)}
#runbar{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
#runbar span{flex:1}#runbar a{color:inherit}#runbar .ok{color:var(--ok)}#runbar .bad{color:#e5484d}
#runbar .btn{padding:4px 10px;font-size:12.5px}
main{overflow:auto;min-width:0}
.wrap{max-width:900px;margin:0 auto;padding:32px 28px 64px}
.back{display:none;margin-bottom:14px}
.crumb{color:var(--muted);font-size:13.5px;font-weight:500}
h2.title{font-size:28px;line-height:1.25;margin:6px 0 14px;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.pill{font-size:13px;padding:5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);text-decoration:none}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:600}
a.pill:hover{color:var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--text);border-color:var(--accent)}
.tab .n{font-size:12px;background:var(--panel2);border-radius:99px;padding:1px 7px;margin-left:4px}
.md{overflow-wrap:anywhere}
.md h1,.md h2,.md h3{line-height:1.3;margin:1.4em 0 .5em}
.md h1{font-size:22px}.md h2{font-size:19px}.md h3{font-size:16px}
.md code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:var(--panel2);padding:.15em .4em;border-radius:5px}
.md pre code{background:none;padding:0}
pre{background:var(--code);color:#e6e8ee;border-radius:12px;padding:16px;overflow:auto;font:13px/1.6 'JetBrains Mono',monospace;margin:0}
.md table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.file{margin-bottom:16px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.fhead .nm{flex:1;font-family:'JetBrains Mono',monospace;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead .sz{color:var(--muted);font-size:12.5px}
.fhead .btn{padding:6px 12px;font-size:13px}
.file pre{border-radius:0;max-height:560px}
.file iframe{width:100%;height:640px;border:0;display:block;background:#fff}
.file img{max-width:100%;display:block;margin:auto}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;padding:16px;z-index:9}
#modal .card{max-width:440px;width:100%;padding:24px}
#modal h3{margin:0 0 8px}#modal p{color:var(--muted);margin:0 0 14px;font-size:14px}
#modal textarea{width:100%;height:110px;font:12px 'JetBrains Mono',monospace;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:10px;resize:none}
#modal .row{display:flex;gap:8px;margin-top:12px}#modal .row .btn{flex:1}
.gh-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.gh-row .field{flex:1;min-width:180px;padding:9px 12px}
.tree{max-height:280px;overflow:auto;padding:6px}
.tree button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:7px;cursor:pointer;font:13px 'JetBrains Mono',monospace}
.tree button:hover{background:var(--panel2)}.tree button.sel{background:var(--accent-soft);color:var(--accent)}
#editor{width:100%;min-height:380px;font:13px/1.55 'JetBrains Mono',monospace;background:var(--code);color:#e6e8ee;border:0;padding:14px;resize:vertical;tab-size:4;display:block}
.status{font-size:13.5px;margin-top:8px;min-height:20px}.status.ok{color:var(--ok)}.status.bad{color:#e5484d}
select.field{padding:9px 12px}
.fc{padding:28px 22px;text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.fc .q{font-size:20px;font-weight:600;line-height:1.35}.fc .a{font-size:17px;color:var(--ok)}
.fc .src{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--ok)}
.fc-btns{display:flex;gap:10px;margin-top:16px}.fc-btns .btn{flex:1;padding:14px}
.btn.bad{background:#e5484d}.btn.good{background:var(--ok)}
#print{display:none}
@media print{
  @page{margin:16mm 14mm}
  body{background:#fff!important;color:#111}
  #app,#lock,#modal,#tabbar{display:none!important}
  #print{display:block;font:11pt/1.5 Inter,system-ui,sans-serif;color:#111}
  #print h1{font-size:20pt;margin:0 0 4pt}#print h2{font-size:14pt;margin:18pt 0 6pt;border-bottom:1px solid #ccc;padding-bottom:3pt}
  #print .meta{color:#555;font-size:10pt;margin-bottom:12pt}
  #print pre{background:#f5f6f8!important;color:#111!important;border:1px solid #ddd;border-radius:6px;padding:8pt;font:8.5pt/1.45 'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word;max-height:none;overflow:visible}
  #print pre code,#print pre code *{color:inherit!important;background:none!important}
  #print .fname{font:600 9.5pt 'JetBrains Mono',monospace;margin:12pt 0 4pt}
  #print .md code{background:#f0f0f0;padding:0 3pt;border-radius:3px}
  #print table{border-collapse:collapse}#print th,#print td{border:1px solid #ccc;padding:3pt 6pt}
  #print .md h1,#print .md h2,#print .md h3{font-size:12pt;border:0;margin:12pt 0 4pt;padding:0}
  #print h2,#print .fname{break-after:avoid}#print pre{break-inside:auto}
}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.empty .big{font-size:40px;margin-bottom:8px}
/* nav */
.snav{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
.snav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:500;color:var(--muted);text-align:left}
.snav button:hover{background:var(--panel2);color:var(--text)}
.snav button.on{background:var(--accent-soft);color:var(--accent)}
.snav svg,#tabbar svg{width:20px;height:20px;flex:none}
#tabbar{display:none}
.group{display:flex;align-items:center;gap:8px}.gdot{width:8px;height:8px;border-radius:3px;background:var(--c)}
/* dashboard */
.home-head{margin-bottom:18px}
.hero{display:block;width:100%;text-align:left;cursor:pointer;padding:22px;margin-bottom:16px;border:0;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#2a1b6b))}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hero .crumb{color:rgba(255,255,255,.8)}
.hchip{font-size:12px;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.22);color:#fff;padding:4px 10px;border-radius:99px}
.hero-title{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:16px;position:relative;z-index:1}
.countdown{display:flex;gap:10px;margin-bottom:16px;position:relative;z-index:1}
.countdown div{background:rgba(0,0,0,.18);border-radius:12px;padding:8px 0;min-width:62px;text-align:center}
.countdown b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.countdown span{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.countdown.late div{background:rgba(229,72,77,.5)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;opacity:.95;position:relative;z-index:1;gap:8px;flex-wrap:wrap}
.hero-foot .pill{background:rgba(255,255,255,.2);color:#fff;border:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.tile{padding:14px 16px}.tile .tv{font-size:24px;font-weight:700;margin:4px 0 0}.tile .tl{font-size:12.5px;color:var(--muted)}
.sec-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 4px}
.week{padding:6px;margin-bottom:22px}
.wk{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.wk:hover{background:var(--panel2)}
.wk-day{width:58px;flex:none;border-left:3px solid var(--c);padding-left:10px}.wk-day b{display:block;font-size:14px}.wk-day span{font-size:12px;color:var(--muted)}
.wk-main{flex:1;min-width:0}.wk-t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;cursor:pointer;text-align:left;font-size:22px}
.qa b{font-size:15px;margin-top:6px}.qa span{font-size:12.5px;color:var(--muted)}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:16px}.banner span{flex:1;font-size:14px}
.set{padding:6px;margin-bottom:16px}
.set button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:13px 12px;cursor:pointer;text-align:left;font-size:15px}
.set button:hover{background:var(--panel2)}.set button span{flex:1}.set button small{color:var(--muted);font-size:12.5px}
.swipe-hint{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
/* lock screen */
#lock{background:radial-gradient(60% 50% at 20% 10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent),radial-gradient(50% 40% at 90% 90%,color-mix(in srgb,#c06bff 18%,transparent),transparent),var(--bg)}
/* motion */
@media (prefers-reduced-motion:no-preference){
  .wrap>*{animation:rise .34s cubic-bezier(.2,.8,.2,1) both}
  .wrap>*:nth-child(2){animation-delay:.03s}.wrap>*:nth-child(3){animation-delay:.06s}.wrap>*:nth-child(4){animation-delay:.09s}
  .wrap>*:nth-child(5){animation-delay:.12s}.wrap>*:nth-child(6){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  #lock .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .btn,.item,.qa,.wk,.hero,.tab,.set button,#tabbar button{transition:transform .12s ease,background .15s ease,color .15s ease}
  .btn:active,.item:active,.qa:active,.wk:active,.hero:active,.set button:active,#tabbar button:active{transform:scale(.96)}
  .fc{transition:transform .2s ease,background .2s ease}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #app[data-view=list] main{display:none}
  #app:not([data-view=list]) aside{display:none}
  aside{border-right:0}
  .snav,.brand .icon-btn{display:none}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  #tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;border-radius:12px;padding:7px 0 5px;font-size:11px;font-weight:600;color:var(--muted)}
  #tabbar button.on{color:var(--accent)}
  #tabbar button.on svg{transform:translateY(-1px)}
  main,#list{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .side-head{padding-top:calc(18px + env(safe-area-inset-top))}
  .wrap{padding:calc(20px + env(safe-area-inset-top)) 16px 48px}
  .back{display:inline-flex}
  h2.title{font-size:23px}
  .tiles{grid-template-columns:1fr 1fr}
  .countdown div{min-width:0;flex:1}
}
</style>
</head>
<body>
<section id="lock">
  <form class="card" id="lockform">
    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>Vault</h1>
    <p>Passwort eingeben zum Entsperren.</p>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Passwort" autofocus>
    <label class="check"><input type="checkbox" id="remember" checked> Auf diesem Gerät merken</label>
    <button class="btn" id="unlock">Entsperren</button>
    <div id="err"></div>
  </form>
</section>

<div id="app">
  <aside>
    <div class="side-head">
      <div class="brand"><div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2"/></svg></div>
        <span>Abgaben</span><span class="sp"></span>
        <button class="icon-btn" id="practice" title="Üben (Karteikarten)">🧠</button>
        <button class="icon-btn" id="bell" title="Push-Benachrichtigungen">🔔</button>
        <button class="icon-btn" id="theme" title="Theme">◐</button>
        <button class="icon-btn" id="logout" title="Sperren"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
      </div>
      <nav class="snav"><button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Übersicht</span></button><button data-go="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2"/><path d="M9 7h7M9 11h5"/></svg><span>Abgaben</span></button><button data-go="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3a3.5 3.5 0 0 0-3.4 4.4A3.5 3.5 0 0 0 5 14a3.5 3.5 0 0 0 4.5 5.2V3zM14.5 3a3.5 3.5 0 0 1 3.4 4.4A3.5 3.5 0 0 1 19 14a3.5 3.5 0 0 1-4.5 5.2V3z"/></svg><span>Üben</span></button><button data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Mehr</span></button></nav>
      <input class="field" id="q" placeholder="Suchen…" type="search">
      <div id="runbar" style="display:none"><span id="runtxt">…</span><button class="btn ghost" id="runnow">↻ Jetzt prüfen</button></div>
      <div class="stats" id="filters"></div>
    </div>
    <div id="list"></div>
  </aside>
  <main><div class="wrap" id="detail"></div></main>

<script>

async function decrypt(key, buf) {
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12)}, key, buf.slice(12)));
}
async function load(key, meta) {
  const P = JSON.parse(new TextDecoder().decode(await decrypt(key, b64(meta.data))));
  ITEMS = Array.isArray(P) ? P : P.items; GH = Array.isArray(P) ? null : P.gh;
  KEY = key;
  $('#lock').style.display = 'none'; $('#app').style.display = 'grid';
  const h = decodeURIComponent(location.hash.slice(1));
  selId = ITEMS.some(i => i.id === h) ? h : null;
  renderList(); go(selId ? 'detail' : (['practice','list','more'].includes(h) ? h : 'home'));
  if (GH) runStatus();
  // offline: keep every encrypted file in the cache so the vault works without internet
  if ('caches' in window && navigator.onLine) caches.open('vault-v1').then(c => c.addAll(
    [...new Set(ITEMS.flatMap(i => i.files.concat(i.solution)).filter(f => f.blob).map(f => new URL(f.blob, location).href))])).catch(() => {});
}
async function boot() {
  const meta = await (await fetch('data.json', {cache:'no-store'})).json();
  window.META = meta;
  const saved = store.get('vaultkey:' + meta.salt);
  if (saved) {
    try { await load(await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', true, ['decrypt']), meta); return; }
    catch { store.del('vaultkey:' + meta.salt); }
  }
}
$('#lockform').onsubmit = async e => {

  try {
    const m = window.META, base = await crypto.subtle.importKey('raw', new TextEncoder().encode($('#pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(m.salt), iterations:m.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
    await load(key, m);
    if ($('#remember').checked) {

      store.set('vaultkey:' + m.salt, btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw', key)))));

};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => DOMPurify.sanitize(marked.parse(s || ''));
const dueTs = i => { const m = /(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(i.due); return m ? new Date(m[1], m[2]-1, m[3], m[4], m[5]).getTime() : Infinity; };
const fmtDue = i => { const t = dueTs(i); if (t === Infinity) return 'Kein Abgabedatum';
  const d = new Date(t), days = Math.ceil((t - Date.now()) / 864e5);
  const s = d.toLocaleDateString('de-AT', {weekday:'short', day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('de-AT', {hour:'2-digit', minute:'2-digit'});
  return s + (days < 0 ? ' · vorbei' : days === 0 ? ' · heute' : days === 1 ? ' · morgen' : ` · in ${days} Tagen`); };
const kb = n => n > 1e6 ? (n/1e6).toFixed(1)+' MB' : Math.max(1, Math.round(n/1e3))+' KB';

function renderList() {

  selId = it.dataset.id; tab = 'solution'; location.hash = selId; renderList(); go('detail'); $('main').scrollTop = 0; };

function fileCard(f, idx, kind) {
  const ext = f.name.split('.').pop().toLowerCase();
  let body = '';
  if (f.text != null) {
    const lang = hljs.getLanguage(ext) ? ext : ({py:'python',js:'javascript',ts:'typescript',cs:'csharp',sql:'sql',md:'markdown'}[ext] || 'plaintext');
    body = ext === 'md' ? `<div class="md" style="padding:4px 18px 10px">${md(f.text)}</div>` :
      `<pre><code class="language-${lang}">${esc(f.text)}</code></pre>`;
  } else if (['pdf','png','jpg','jpeg','gif','webp','svg'].includes(ext)) {
    body = `<div data-preview="${kind}:${idx}" style="padding:24px;color:var(--muted);text-align:center">Lade Vorschau…</div>`;
  }
  return `<div class="card file"><div class="fhead"><span class="nm" title="${esc(f.name)}">${esc(f.name)}</span><span class="sz">${kb(f.size)}</span>
    <button class="btn ghost" data-dl="${kind}:${idx}">Download</button></div>${body}</div>`;
}
const blobCache = {};
async function getBlob(f) {
  if (blobCache[f.blob || f.name]) return blobCache[f.blob || f.name];
  const ext = f.name.split('.').pop().toLowerCase();
  const type = {pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml'}[ext] || 'application/octet-stream';
  const data = f.text != null ? new TextEncoder().encode(f.text) : await decrypt(KEY, new Uint8Array(await (await fetch(f.blob)).arrayBuffer()));
  return blobCache[f.blob || f.name] = URL.createObjectURL(new Blob([data], {type}));
}

function renderDetail() {

      <div class="gh-row"><b style="flex:1">Abgeben</b><a class="pill" href="https://github.com/${esc(i.repo)}" target="_blank" rel="noopener">${esc(i.repo.split('/')[1])} ↗</a></div>
      <p class="crumb" style="margin:0 0 10px">Merged den Branch <code>autopilot</code> in <code>main</code> – zählt danach als abgegeben.</p>

        <div class="status" id="cstat"></div></div></div></div>`;
  if (tab === 'files') body = i.files.length ? i.files.map((f,n) => fileCard(f,n,'files')).join('') : '<div class="empty">Keine Anhänge.</div>';
  $('#detail').innerHTML = `<button class="btn ghost back" id="back">← Zurück</button>

    ${i.link?`<a class="pill" href="${esc(i.link)}" target="_blank" rel="noopener">Moodle ↗</a>`:''}</div>
    <div class="tabs">${tabs.map(([k,l,n]) => `<button class="tab ${tab===k?'on':''}" data-tab="${k}">${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>${body}`;
  $('#detail').querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

  $('#detail').querySelectorAll('[data-preview]').forEach(async el => {

$('#detail').onclick = async e => {

  const d = e.target.closest('[data-dl]'); if (d) {
    const i = ITEMS.find(x => x.id === selId), [k, n] = d.dataset.dl.split(':'), f = i[k][n];

// push notifications
const modal = (title, text, code) => { $('#mtitle').textContent = title; $('#mtext').textContent = text;
  $('#mcode').style.display = $('#mcopy').style.display = code ? '' : 'none'; $('#mcode').value = code || ''; $('#modal').style.display = 'grid'; };
$('#mclose').onclick = () => $('#modal').style.display = 'none';

$('#bell').onclick = async () => {
  try {
    if (!('PushManager' in window)) throw new Error('Dieser Browser unterstützt keine Push-Benachrichtigungen. (Brave: Einstellungen → Datenschutz → „Google-Dienste für Push-Nachrichten verwenden“ aktivieren, oder Samsung Internet nehmen.)');
    if (await Notification.requestPermission() !== 'granted') throw new Error('Benachrichtigungen wurden blockiert. In den Seiteneinstellungen erlauben und nochmal tippen.');
    const reg = await navigator.serviceWorker.ready;

    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: key});
    modal('Fast fertig 🔔', 'Diesen Code kopieren und Claude schicken (einmalig pro Gerät). Danach kommen Erinnerungen 12h vor jeder offenen Abgabe.', JSON.stringify(sub));
  } catch (e) { modal('Push nicht möglich', e.message || String(e)); }
};
// GitHub (school account) – hand in + edit/commit
const api = async (path, opt = {}) => {
  const r = await fetch('https://api.github.com/' + path, {...opt, headers: {Authorization: 'Bearer ' + GH, Accept: 'application/vnd.github+json', ...(opt.body ? {'Content-Type': 'application/json'} : {})}});
  const j = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error((j && j.message) || r.statusText), {status: r.status});
  return {status: r.status, data: j};
};
const utf8b64 = s => { const b = new TextEncoder().encode(s); let x = ''; for (let k = 0; k < b.length; k += 0x8000) x += String.fromCharCode(...b.subarray(k, k + 0x8000)); return btoa(x); };
const b64utf8 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g, '')), c => c.charCodeAt(0)));
let ghFile = null;
async function ghInit(i) {
  const stat = (id, msg, ok) => { const el = $(id); el.textContent = msg; el.className = 'status ' + (ok === true ? 'ok' : ok === false ? 'bad' : ''); };
  let branches = [];
  try { branches = (await api(`repos/${i.repo}/branches?per_page=100`)).data.map(b => b.name); }
  catch (e) { $('#tree').innerHTML = `<div class="status bad" style="padding:10px">GitHub-Fehler: ${esc(e.message)}</div>`; return; }
  const def = branches.includes('autopilot') ? 'autopilot' : branches.includes('main') ? 'main' : branches[0];
  $('#branch').innerHTML = branches.map(b => `<option ${b===def?'selected':''}>${esc(b)}</option>`).join('');
  if (!branches.includes('autopilot')) { $('#merge').disabled = true; stat('#mstat', 'Kein autopilot-Branch – Änderungen unten direkt committen.'); }
  const loadTree = async () => {
    $('#edit').style.display = 'none'; $('#tree').innerHTML = '<div class="crumb" style="padding:10px">Lade…</div>';
    const t = (await api(`repos/${i.repo}/git/trees/${encodeURIComponent($('#branch').value)}?recursive=1`)).data.tree.filter(x => x.type === 'blob');
    $('#tree').innerHTML = t.map(x => `<button data-p="${esc(x.path)}">${esc(x.path)}</button>`).join('') || '<div class="crumb" style="padding:10px">Leer.</div>';
  };
  $('#branch').onchange = loadTree; await loadTree();
  $('#tree').onclick = async e => {
    const b = e.target.closest('[data-p]'); if (!b) return;
    $('#tree').querySelectorAll('.sel').forEach(x => x.classList.remove('sel')); b.classList.add('sel');
    const f = (await api(`repos/${i.repo}/contents/${b.dataset.p.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent($('#branch').value)}`)).data;
    ghFile = {path: f.path, sha: f.sha};
    $('#epath').textContent = f.path; $('#editor').value = f.size > 1e6 ? '(Datei zu groß zum Bearbeiten)' : b64utf8(f.content || '');
    $('#cmsg').value = 'Update ' + f.path.split('/').pop(); stat('#cstat', ''); $('#edit').style.display = '';
  };
  $('#commit').onclick = async () => {
    if (!ghFile) return; $('#commit').disabled = true; stat('#cstat', 'Pushe…');
    try {
      const r = await api(`repos/${i.repo}/contents/${ghFile.path.split('/').map(encodeURIComponent).join('/')}`, {method: 'PUT',
        body: JSON.stringify({message: $('#cmsg').value || 'Update', content: utf8b64($('#editor').value), sha: ghFile.sha, branch: $('#branch').value})});
      ghFile.sha = r.data.content.sha; stat('#cstat', `✓ Gepusht auf ${$('#branch').value} (${r.data.commit.sha.slice(0,7)})`, true);
    } catch (e) { stat('#cstat', 'Fehler: ' + e.message, false); }
    $('#commit').disabled = false;
  };
  $('#merge').onclick = () => {
    const mb = $('#merge');
    if (mb.dataset.armed !== '1') { mb.dataset.armed = '1'; mb.textContent = 'Sicher? Nochmal tippen'; setTimeout(() => { mb.dataset.armed = ''; mb.textContent = 'Abgeben'; }, 4000); return; }
    $('#merge').dataset.armed = ''; $('#merge').disabled = true; $('#merge').textContent = 'Abgeben'; stat('#mstat', 'Merge…');
    api(`repos/${i.repo}/merges`, {method: 'POST', body: JSON.stringify({base: 'main', head: 'autopilot', commit_message: $('#mmsg').value || 'Abgabe'})})
      .then(r => stat('#mstat', r.status === 204 ? 'Nichts zu mergen – main ist schon aktuell.' : `✓ Abgegeben: in main gemerged (${r.data.sha.slice(0,7)})`, true))
      .catch(e => stat('#mstat', e.status === 409 ? 'Merge-Konflikt – bitte lokal mergen.' : 'Fehler: ' + e.message, false))
      .finally(() => $('#merge').disabled = false);
  };
}
// Nachbessern + Moodle-Abgabe (via autopilot workflow)
const AUTOPILOT = 'SomeDud3/moodle-autopilot';

function actionCards(i) {

  return `<div class="card" style="padding:18px;margin-bottom:16px">
      <b>Nachbessern</b><p class="crumb" style="margin:4px 0 10px">Was soll Claude ändern? Startet sofort, Push kommt wenn fertig (~5–15 min).</p>
      ${i.feedback ? `<div class="pill warn" style="display:inline-block;margin-bottom:10px">⏳ Wartet: ${esc(i.feedback.slice(0,80))}</div>` : ''}

      <div class="gh-row" style="margin:10px 0 0"><span style="flex:1"></span><button class="btn" id="fbsend">Nachbessern lassen</button></div>
      <div class="status" id="fbstat"></div></div>
    ${moodleCard(i)}`;

// Moodle accepts only what "Abgabeformat" allows: file types + max count, or no files at all
function fmtOf(i) {
  const f = i.format || '';
  if (!f || /^Dateien/.test(f)) {
    const m = f.match(/^Dateien \(([^;]*); max (\d+|\?)\)/) || [];
    const types = m[1] && m[1] !== 'alle Typen' ? m[1].split(',').map(t => t.trim().toLowerCase()) : null;
    return {files: true, types, max: m[2] && m[2] !== '?' ? +m[2] : 0};
  }
  return {files: false};
}
const allowedFile = (fm, name) => !fm.types || fm.types.some(t => name.toLowerCase().endsWith(t));
function moodleCard(i) {
  const fm = fmtOf(i);
  if (!fm.files) return `<div class="card" style="padding:18px;margin-bottom:20px"><b>Auf Moodle abgeben</b>
      <p class="crumb" style="margin:6px 0 0">Moodle nimmt hier keine Dateien an (${esc(i.format)}).${i.repo ? ' → Abgabe über den <b>GitHub</b>-Tab.' : ''}</p></div>`;

  if (ITEMS.some(i => i.id === h)) { if (selId !== h) { selId = h; tab = 'solution'; renderList(); go('detail'); } }
  else if (['home', 'list', 'practice', 'more'].includes(h) && view !== h) go(h);
});
boot();
</script>
</body>
</html>
